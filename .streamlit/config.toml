# Streamlit theme -- "Clean light / report" (Swiss / Minimalist style).
# Light background, near-black ink, restrained neutral grays, one calm accent.
[theme]
base = "light"
primaryColor = "#1a1a1a"             # ink -- accent is near-black, not a bright hue
backgroundColor = "#ffffff"          # paper
secondaryBackgroundColor = "#f6f6f4" # faint warm gray (cards / sidebar)
textColor = "#1a1a1a"                # near-black ink
font = "serif"

[server]
headless = true

[browser]
gatherUsageStats = false
